name: sudoq_usage
description: "Kotlin bridge for suDOq: usage access, per-app foreground time, installed apps."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sudoq.sudoq_usage
        pluginClass: SudoqUsagePlugin
